<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js Template Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,900;1,900&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400;700&family=Manrope:wght@200;400;800&family=Orbitron:wght@400;700;900&display=swap"
    />
    <!--
      Fonts for the templates under src/screens/website/. Kept in one request
      alongside the playground faces above: Almarai (Prisma), Geist + Special
      Elite (Wandor), Instrument Serif (Axon, Prisma, Measured), Kanit (Jack).
      Inter is already loaded above and covers Axon and Measured.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Kanit:wght@300;400;500;600;700;800;900&family=Special+Elite&display=swap"
    />
    <!--
      Second wave of website faces: Playfair Display (Lithos), Barlow (Aster),
      Anton + Condiment (Orbis), Readex Pro (Securify). basis33 — the pixel face
      Adam Roberts is built on — is self-hosted in src/index.css instead, since
      its only distributor is a third-party font CDN we would otherwise have to
      reach at runtime.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@300;400;500;600&family=Condiment&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Readex+Pro:wght@300;400;500;600;700&display=swap"
    />
    <!--
      Third wave: Cormorant Garamond + Plus Jakarta Sans (Verde, NaturaVista)
      and Outfit (Skyline, Wander). Playfair Display gained its upright weights
      in the link above rather than a new one — it was italic-only for Lithos,
      and Mindful and Basilico both set headings in the roman.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
